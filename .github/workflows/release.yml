name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_STRING | base64 -d > release.jks

      - name: Parse version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must match vMAJOR.MINOR (e.g. v1.0, v2.3)."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          VERSION_NAME="$MAJOR.$MINOR"
          VERSION_CODE=$((MAJOR * 100 + MINOR))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Resolved tag '$TAG' -> versionName='$VERSION_NAME' versionCode=$VERSION_CODE"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME"

      - name: Android lint
        run: ./gradlew :app:lintDebug -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
